{% extends "base.html" %}
{% block title %}New company{% endblock %}
{% block content %}
<h1>New company</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/companies" class="narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Name <input type="text" name="name" value="{{ values.name or '' }}" maxlength="120" required></label>
  <label>Time zone
    <select name="timezone">
      {% for tz in timezones %}<option value="{{ tz }}" {% if tz == values.timezone %}selected{% endif %}>{{ tz }}</option>{% endfor %}
    </select>
  </label>
  <label>Industry <input type="text" name="industry" value="{{ values.industry or '' }}" maxlength="60" placeholder="HVAC"></label>
  <label>Source type
    <select name="source_type">
      {% for s in source_types %}<option value="{{ s }}" {% if s == values.source_type %}selected{% endif %}>{{ s }}</option>{% endfor %}
    </select>
  </label>
  <label>Owner's name <input type="text" name="owner_name" value="{{ values.owner_name or '' }}" maxlength="120" required></label>
  <label>Owner's email <input type="email" name="owner_email" value="{{ values.owner_email or '' }}" required></label>
  <button type="submit">Create company</button>
</form>
{% endblock %}
